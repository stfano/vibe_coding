services:
  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-60}
      REDIS_URL: redis://redis:6379/0
      VECTOR_STORE_BACKEND: ${VECTOR_STORE_BACKEND:-pgvector}
      VECTOR_DIMENSIONS: ${VECTOR_DIMENSIONS:-1024}
      VECTOR_DISTANCE_METRIC: ${VECTOR_DISTANCE_METRIC:-cosine}
      VECTOR_SIMILARITY_THRESHOLD: ${VECTOR_SIMILARITY_THRESHOLD:-0.7}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-doctor-chat-documents}
      EMBEDDING_SERVICE_URL: http://embedding-service:8080
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-ollama}
      CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-llama3.2:1b}
      CHAT_LLM_TIMEOUT: ${CHAT_LLM_TIMEOUT:-180}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      embedding-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  embedding-service:
    build:
      context: ./embedding-service
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mykor/KURE-v1}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-doctor_chat_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  frontend_node_modules:
  redis_data:
  minio_data:
  ollama_data:
