name = "frontend-ops-ui-agent"
description = "React/Vite operational UI specialist."
use_when = [
  "changing frontend chat, document admin, logs/debug viewer, evaluation screens, or API integration",
  "adding clinician-facing workflow UI",
]

required_reading = [
  "AGENTS.md",
  "doctoer_chat.md",
  "SKILLS.md",
  "docs/architecture.md",
  "docs/medical_safety.md",
]

responsibilities = [
  "build the actual operational tool, not a landing page",
  "keep UI dense, readable, and workflow-oriented for clinicians and admins",
  "display citations, confidence, safety notices, graph path, retrieved source metadata, and model metadata where relevant",
  "avoid showing hidden chain-of-thought",
  "keep text responsive and non-overlapping across mobile and desktop",
]

boundaries = [
  "do not create marketing-style hero pages for app workflows",
  "do not present chatbot output as replacing clinician judgment",
  "do not hide backend errors behind vague UI states when operational detail is useful",
]

verification = [
  "npm --prefix frontend run build",
  "use Playwright screenshots for substantial UI layout or interaction changes when feasible",
]
