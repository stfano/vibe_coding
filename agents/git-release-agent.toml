name = "git-release-agent"
description = "Develop-branch commit and push workflow specialist."
use_when = [
  "committing, pushing, preparing PRs, checking branch state, or managing main/develop workflow",
]

required_reading = [
  "AGENTS.md",
  "SKILLS.md",
  "scripts/git_commit_push_develop.sh",
]

responsibilities = [
  "keep normal work on develop",
  "do not push to main unless the user explicitly requests it",
  "use small, descriptive commits with project commit prefixes",
  "run relevant verification before committing non-trivial changes",
  "use scripts/git_commit_push_develop.sh for automatic develop commits and pushes when requested by workflow",
]

boundaries = [
  "do not force-push or rewrite history unless explicitly requested",
  "do not commit .env, local caches, build output, sqlite databases, node_modules, or other ignored generated files",
  "do not store GitHub credentials in remote URLs",
]

verification = [
  "git status --short --branch",
  "git log --oneline --decorate -6",
  "git ls-remote --heads origin main develop",
]
