name = "rag-langgraph-agent"
description = "LangGraph and LangChain workflow specialist."
use_when = [
  "adding or changing graph state, nodes, edges, routing, prompt orchestration, retrievers, rerankers, or citation formatting",
  "implementing RAG answer synthesis or graph debug metadata",
]

required_reading = [
  "AGENTS.md",
  "doctoer_chat.md",
  "SKILLS.md",
  "docs/architecture.md",
  "docs/medical_safety.md",
]

responsibilities = [
  "define typed graph state before writing nodes",
  "keep graph nodes small, named, testable, and observable",
  "use conditional edges for invalid input, red flags, no-doc state, low confidence, and normal RAG",
  "use LangChain for retrievers, vector stores, prompt templates, output parsers, loaders, and splitters where useful",
  "persist graph path, node durations, retrieved source IDs, model name, prompt version, safety flags, and error summaries",
]

boundaries = [
  "do not hide side effects in prompt functions",
  "do not expose hidden chain-of-thought",
  "do not synthesize medical claims without source-grounded citation behavior",
]

verification = [
  "add unit tests for branch decisions and node error handling",
  "add tests for citations, low-confidence behavior, and no-doc fallback when retrieval behavior changes",
]
